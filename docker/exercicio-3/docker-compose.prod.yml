services:
  api:
    build:
      context: .
      target: prod
    environment:
      NODE_ENV: production
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-orion}
      DB_PASS: ${DB_PASS:-orion_dev_password}
      DB_NAME: ${DB_NAME:-orion}
    ports:
      - "3004:3000"
    networks:
      - orion_exercicio_3_prod
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-orion}
      POSTGRES_PASSWORD: ${DB_PASS:-orion_dev_password}
      POSTGRES_DB: ${DB_NAME:-orion}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - orion_exercicio_3_prod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_prod_data:

networks:
  orion_exercicio_3_prod:
    name: orion-exercicio-3-prod-network
