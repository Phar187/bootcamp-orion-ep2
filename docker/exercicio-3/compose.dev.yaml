services:
  api:
    build:
      context: .
      target: dev
    command: npm run dev
    environment:
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-orion}
      DB_PASS: ${DB_PASS:-orion_dev_password}
      DB_NAME: ${DB_NAME:-orion}
    ports:
      - "3003:3000"
    networks:
      - orion_exercicio_3_dev
    volumes:
      - ./src:/app/src
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-orion}
      POSTGRES_PASSWORD: ${DB_PASS:-orion_dev_password}
      POSTGRES_DB: ${DB_NAME:-orion}
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    networks:
      - orion_exercicio_3_dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_dev_data:

networks:
  orion_exercicio_3_dev:
    name: orion-exercicio-3-dev-network
