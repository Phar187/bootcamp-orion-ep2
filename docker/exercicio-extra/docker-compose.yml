services:
  api:
    build:
      context: ./api
    environment:
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-orion}
      DB_PASS: ${DB_PASS:-orion_dev_password}
      DB_NAME: ${DB_NAME:-orion}
    ports:
      - "3005:3000"
    volumes:
      - ./api/src:/app/src
    networks:
      - orion_desafio
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-orion}
      POSTGRES_PASSWORD: ${DB_PASS:-orion_dev_password}
      POSTGRES_DB: ${DB_NAME:-orion}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - orion_desafio
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:4-standalone
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    networks:
      - orion_desafio
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:

networks:
  orion_desafio:
    name: orion-desafio-docker-network
